name: App
options:
  bundleIdPrefix: com.buckthem
  deploymentTarget:
    iOS: "15.0"
packages: {}
targets:
  Capacitor:
    type: framework
    platform: iOS
    sources:
      - path: ../../node_modules/@capacitor/ios/Capacitor/Capacitor
    settings:
      base:
        PRODUCT_NAME: Capacitor
        PRODUCT_BUNDLE_IDENTIFIER: org.capacitor.Capacitor
        MODULEMAP_FILE: ../../node_modules/@capacitor/ios/Capacitor/Capacitor/Capacitor.modulemap
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
  Cordova:
    type: framework
    platform: iOS
    sources:
      - path: ../../node_modules/@capacitor/ios/CapacitorCordova/CapacitorCordova
    settings:
      base:
        PRODUCT_NAME: Cordova
        INFOPLIST_FILE: ../../node_modules/@capacitor/ios/CapacitorCordova/CapacitorCordova/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.capacitor.Cordova
        MODULEMAP_FILE: ../../node_modules/@capacitor/ios/CapacitorCordova/CapacitorCordova/CapacitorCordova.modulemap
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SWIFT_PACKAGE=1"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
  CapacitorPushNotifications:
    type: framework
    platform: iOS
    dependencies:
      - target: Capacitor
    sources:
      - path: ../../node_modules/@capacitor/push-notifications/ios/Sources
    settings:
      base:
        PRODUCT_NAME: CapacitorPushNotifications
        PRODUCT_BUNDLE_IDENTIFIER: org.capacitor.CapacitorPushNotifications
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
  CapacitorShare:
    type: framework
    platform: iOS
    dependencies:
      - target: Capacitor
    sources:
      - path: ../../node_modules/@capacitor/share/ios/Sources
    settings:
      base:
        PRODUCT_NAME: CapacitorShare
        PRODUCT_BUNDLE_IDENTIFIER: org.capacitor.CapacitorShare
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
  App:
    type: application
    platform: iOS
    dependencies:
      - target: Capacitor
        embed: true
      - target: Cordova
        embed: true
      - target: CapacitorPushNotifications
        embed: true
      - target: CapacitorShare
        embed: true
    sources:
      - path: App
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Town App Store"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: App/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.buckthem.town
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "$(inherited) \"-D\" \"COCOAPODS\" \"-DDEBUG\""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
